<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f1" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Dádiva · Amigo secreto con promesas</title>
    <meta
      name="description"
      content="Organiza tu amigo secreto y recibe una promesa bíblica para acompañar tu regalo. Toda buena dádiva desciende de lo alto."
    />

    <!--
      URL absoluta fija: WhatsApp y Facebook exigen og:image absoluta y no
      resuelven %ENV% al leer el HTML servido. El dominio de producción es
      https://dadiva-gray.vercel.app (proyecto Vercel conectado a main; ver
      addendum §11.4 del plan de fusión de marca).
    -->
    <meta property="og:title" content="Dádiva · Amigo secreto con promesas" />
    <meta
      property="og:description"
      content="Crea un grupo, invita a los tuyos, haz el sorteo en secreto y saca tu tarjeta de promesa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://dadiva-gray.vercel.app/" />
    <meta property="og:image" content="https://dadiva-gray.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Rangos recortados a los pesos que la app realmente usa: Fraunces
      500-700 (encabezados y verso), Nunito Sans 400-700 (cuerpo y
      acciones), DM Mono solo 500 (código de grupo) y Caveat solo 600
      (únicamente dentro de la carta de promesa). Menos pesos = menos KB.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Nunito+Sans:opsz,wght@6..12,400..700&family=DM+Mono:wght@500&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
